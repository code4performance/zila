<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0C1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Zila Text Gradient -->
    <linearGradient id="zilaTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <!-- Tagline Gradient -->
    <linearGradient id="bannerTagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="40%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    
    <!-- Solid, Modern Cyan-to-Blue Gradient for the Z -->
    <linearGradient id="zilaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="45%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Chip Frame Gradient -->
    <linearGradient id="chipFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E192D"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>

    <!-- CLIP PATH: Strictly confines everything inside the physical boundary of the Z -->
    <clipPath id="zBoundary">
      <path d="M 220 220
               L 804 220
               L 804 350
               L 440 674
               L 804 674
               L 804 804
               L 220 804
               L 220 674
               L 584 350
               L 220 350
               Z"/>
    </clipPath>

  </defs>

  <!-- Banner Background -->
  <rect width="1600" height="500" rx="24" fill="url(#bannerBg)"/>
  <rect width="1598" height="498" x="1" y="1" rx="23" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.7"/>

  <!-- 1. Z LOGO MARK (Left) -->
  <!-- Left edge at X=230, Right edge at X=470. Top at Y=130, Bottom at Y=370 -->
  <g transform="translate(139.59, 39.59) scale(0.410959)">
    
  <!-- 1. BASE SOLID "Z" BODY -->
  <path d="M 220 220
           L 804 220
           L 804 350
           L 440 674
           L 804 674
           L 804 804
           L 220 804
           L 220 674
           L 584 350
           L 220 350
           Z"
        fill="url(#zilaBody)"/>

  <!-- 2. NEURAL CIRCUIT CONDUITS (STRICTLY CLIPPED INSIDE Z) -->
  <g clip-path="url(#zBoundary)">

    <!-- Group A: Deep Contrast Silicon Sub-Traces -->
    <g fill="none" stroke="#050C1A" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 502 460 L 502 330 L 580 252 L 770 252" stroke-width="12" opacity="0.45"/>
      <path d="M 470 470 L 400 400 L 260 400 L 260 320" stroke-width="10" opacity="0.38"/>
      <path d="M 522 564 L 522 694 L 444 772 L 254 772" stroke-width="12" opacity="0.45"/>
      <path d="M 554 554 L 624 624 L 764 624 L 764 704" stroke-width="10" opacity="0.38"/>
      <path d="M 450 630 L 610 470" stroke-width="6" opacity="0.30"/>
    </g>

    <!-- Group B: Cyber Cyan Synaptic Traces -->
    <g fill="none" stroke="#00F5D4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 526 460 L 526 360 L 600 286 L 760 286" stroke-width="7" opacity="0.80"/>
      <path d="M 480 460 L 440 420 L 320 420 L 280 380 L 280 290" stroke-width="6" opacity="0.65"/>
      <path d="M 640 286 L 664 262 L 730 262" stroke-width="4.5" opacity="0.75"/>
      <path d="M 498 564 L 498 664 L 424 738 L 264 738" stroke-width="7" opacity="0.80"/>
      <path d="M 544 564 L 584 604 L 704 604 L 744 644 L 744 734" stroke-width="6" opacity="0.65"/>
      <path d="M 384 738 L 360 762 L 294 762" stroke-width="4.5" opacity="0.75"/>
    </g>

    <!-- Group C: Luminous Core Traces (Pure White) -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 512 460 L 512 374 L 584 302 L 720 302" stroke-width="3.5" opacity="0.90"/>
      <path d="M 512 564 L 512 650 L 440 722 L 304 722" stroke-width="3.5" opacity="0.90"/>
    </g>

    <!-- Group D: Micro-Vias and Terminal Synapse Nodes -->
    <circle cx="770" cy="252" r="7" fill="#050C1A" opacity="0.5"/>
    <circle cx="760" cy="286" r="8" fill="#050C1A" opacity="0.7"/>
    <circle cx="760" cy="286" r="4.5" fill="#00F5D4" opacity="0.9"/>
    <circle cx="720" cy="302" r="6" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="730" cy="262" r="5" fill="#00F5D4" opacity="0.8"/>
    <circle cx="280" cy="290" r="7" fill="#050C1A" opacity="0.7"/>
    <circle cx="280" cy="290" r="4" fill="#00F5D4" opacity="0.85"/>

    <circle cx="254" cy="772" r="7" fill="#050C1A" opacity="0.5"/>
    <circle cx="264" cy="738" r="8" fill="#050C1A" opacity="0.7"/>
    <circle cx="264" cy="738" r="4.5" fill="#00F5D4" opacity="0.9"/>
    <circle cx="304" cy="722" r="6" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="294" cy="762" r="5" fill="#00F5D4" opacity="0.8"/>
    <circle cx="744" cy="734" r="7" fill="#050C1A" opacity="0.7"/>
    <circle cx="744" cy="734" r="4" fill="#00F5D4" opacity="0.85"/>

    <circle cx="640" cy="286" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="384" cy="738" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- 3. CENTRAL DISCREET AI MICROCHIP -->
  <g transform="translate(512, 512)">
    <g stroke="#091222" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="-22" y1="-48" x2="-22" y2="-54"/>
      <line x1="0" y1="-48" x2="0" y2="-54"/>
      <line x1="22" y1="-48" x2="22" y2="-54"/>
      <line x1="-22" y1="48" x2="-22" y2="54"/>
      <line x1="0" y1="48" x2="0" y2="54"/>
      <line x1="22" y1="48" x2="22" y2="54"/>
      <line x1="-48" y1="-22" x2="-54" y2="-22"/>
      <line x1="-48" y1="0" x2="-54" y2="0"/>
      <line x1="-48" y1="22" x2="-54" y2="22"/>
      <line x1="48" y1="-22" x2="54" y2="-22"/>
      <line x1="48" y1="0" x2="54" y2="0"/>
      <line x1="48" y1="22" x2="54" y2="22"/>
    </g>

    <rect x="-46" y="-46" width="92" height="92" rx="10" fill="url(#chipFrame)" stroke="#00F5D4" stroke-width="2.5"/>
    <rect x="-32" y="-32" width="64" height="64" rx="6" fill="#070D18" stroke="#00B4D8" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">AI</text>
    <circle cx="-25" cy="-25" r="1.8" fill="#00F5D4" opacity="0.9"/>
    <circle cx="25" cy="-25" r="1.8" fill="#00F5D4" opacity="0.9"/>
    <circle cx="-25" cy="25" r="1.8" fill="#00F5D4" opacity="0.9"/>
    <circle cx="25" cy="25" r="1.8" fill="#00F5D4" opacity="0.9"/>
  </g>

  </g>

  <!-- 2. TYPOGRAPHY GROUP (Right - Starts at X=575 with generous 105px gap) -->
  <g transform="translate(575, 0)">
    
    <!-- LINE 1: "Zila Lang" (Proper case) - Top of 'Z' matches Y=130 -->
    <text x="0" y="238" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="800" 
          font-size="144" 
          letter-spacing="1" 
          fill="url(#zilaTitleGrad)">Zila <tspan font-weight="300" fill="#00F5D4" opacity="0.95">Lang</tspan></text>

    <!-- LINE 2: "FAST · SAFE · AI-NATIVE" - Baseline matches Y=370 -->
    <text x="4" y="370" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="700" 
          font-size="34" 
          letter-spacing="8" 
          fill="url(#bannerTagGrad)">FAST · SAFE · AI-NATIVE</text>

  </g>
</svg>
