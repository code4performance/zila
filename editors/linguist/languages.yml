# The entry for github-linguist/linguist's lib/linguist/languages.yml, in alphabetical position
# (between "Zig" and the languages after it, or wherever "Zila" sorts). `language_id` is
# generated by Linguist's own script (see README.md), so it is left out here.
Zila:
  type: programming
  color: "#5b5bd6"
  extensions:
  - ".zila"
  tm_scope: source.zila
  ace_mode: text
  interpreters: []
  aliases:
  - zila-lang
